version: 3

components:
  main:      { in: cmd/strigil }
  ask:       { in: internal/features/ask }
  ask_ui:    { in: internal/features/ask/ui }
  ask_cli:   { in: internal/features/ask/cli }
  intro_ui:  { in: internal/features/intro/ui }
  intro_cli: { in: internal/features/intro/cli }
  kit:       { in: [internal/kit, internal/kit/story, internal/kit/story/**] }
  theme:     { in: internal/kit/theme }
  markdown:       { in: internal/kit/markdown }
  viewer:    { in: internal/kit/viewer }

vendors:
  cobra:     { in: github.com/spf13/cobra }
  fang:      { in: charm.land/fang/v2 }
  bubbletea: { in: charm.land/bubbletea/v2 }
  lipgloss:  { in: charm.land/lipgloss/v2 }
  harmonica: { in: github.com/charmbracelet/harmonica }
  tone:      { in: charm.land/tone }
  bubbles:   { in: charm.land/bubbles/v2/** }
  glamour:   { in: [charm.land/glamour/v2, charm.land/glamour/v2/**] }
  xansi:     { in: github.com/charmbracelet/x/ansi }

deps:
  # main only lists commands.
  main:
    mayDependOn: [ask_cli, intro_cli]
    canUse: [cobra, fang]

  # A feature's command reaches its interface; the interface never reaches
  # a command.
  intro_cli:
    mayDependOn: [intro_ui]
    canUse: [cobra]
  # The command hands the interface the documents; both rest on the logic.
  ask:
    mayDependOn: [markdown]
  ask_cli:
    mayDependOn: [ask, ask_ui]
    canUse: [cobra]
  # The frame round a viewer. It draws no document itself, so it has no
  # use for the markdown renderer.
  ask_ui:
    mayDependOn: [ask, markdown, viewer, kit, theme]
    canUse: [bubbletea, bubbles, lipgloss, xansi]
  intro_ui:
    mayDependOn: [kit, theme]
    canUse: [bubbletea, lipgloss, harmonica]
  kit:
    mayDependOn: [kit]
    canUse: [lipgloss]
  # markdown has no entry: what a document is made of draws nothing and reaches
  # for nothing.
  # A document on screen. It may know the format and the colours, and no
  # feature; the only place markdown is rendered.
  viewer:
    mayDependOn: [markdown, kit, theme]
    canUse: [bubbletea, bubbles, glamour, lipgloss, xansi]
  # The only place the palette is named.
  theme:
    canUse: [tone]
